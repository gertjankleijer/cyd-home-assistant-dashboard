# ============================================================================
# ESP32-2432S028R (CYD) — Home Assistant Dashboard
# ESPHome + LVGL | 320x240 ILI9341 | XPT2046 Touch
#
# PAGE 1 — Weather
# PAGE 2 — Lights
# PAGE 3 — Huis
# PAGE 4 — Muziek
# PAGE 5 — Audio
#
# Aangepast voor:
# - 4 lampen
# - correcte text_sensors voor HA states
# - correcte lichtenteller 0/4 ON
# - Bedlampen verwijderd; Dressoirkast behouden
# - Nederlandse 24-uurs klok
# - Muziekpagina met 6 radiozenders + actieve zender + stop
# - Huispagina met deurstatus, woonkamer temperatuur en wasmachine
# - Audiopagina met volume-slider, volume +/- , mute, play/pauze en stop
# - Automatische displayhelderheid en HA-verbindingsindicator
# - Gasten-WiFi icoon op hoofdpagina met grote QR-code popup
# - Na 1 minuut inactiviteit automatisch terug naar hoofdpagina
# - Audio blijft open zolang Echo Dot afspeelt
# - Na stoppen/pauze: na 1 minuut terug naar hoofdpagina
# - Radiozender kiezen opent automatisch Echo Dot volume
# - Wasmachine-popup opent automatisch zodra de wasmachine aangaat
# - Dubbelklik op lamp opent dimmer-popup
# - Voorraam RGB-popup bevat kleurkeuze
# - Warm wit Voorraam RGB is exact 2400 K
# - NPO 3FM toegevoegd via TuneIn
# - Onderin vaste vorige/volgende paginaknoppen met doorloop van laatste naar eerste
# ============================================================================
# v22 — unified secrets + navigatieknoppen
# Persoonlijke instellingen en Home Assistant entity-ID's staan in secrets.yaml.
# Deze dashboard-YAML kan daardoor veilig als basis voor de publieke GitHub-versie dienen.
# ============================================================================

substitutions:
  device_name: "cyd-dashboard"
  friendly_name: !secret cyd_dashboard_friendly_name

  # WiFi van de ESP zelf
  # De ESP blijft dus gewoon op je normale thuisnetwerk.
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # Gasten-WiFi — alleen voor QR-code
  guest_wifi_ssid: !secret guest_wifi_ssid
  guest_wifi_password: !secret guest_wifi_password
  # Lights
  light_living_room: !secret light_living_room
  light_kitchen: !secret light_kitchen
  light_office: !secret light_office
  light_dressoir: !secret light_dressoir

  # Muziek / radio
  music_538: !secret music_538
  music_qmusic: !secret music_qmusic
  music_veronica: !secret music_veronica
  music_bingo_fm: !secret music_bingo_fm
  music_sterren_nl: !secret music_sterren_nl

  # Weather
  weather_entity: !secret weather_entity
  weather_temperature_entity: !secret weather_temperature_entity
  weather_apparent_temperature: !secret weather_apparent_temperature
  weather_wind_entity: !secret weather_wind_entity
  weather_pressure_entity: !secret weather_pressure_entity
  weather_wind_bearing_entity: !secret weather_wind_bearing_entity

  # Media / Huis
  media_player_entity: !secret media_player_entity
  front_door_lock_entity: !secret front_door_lock_entity
  living_room_climate_entity: !secret living_room_climate_entity
  washing_machine_entity: !secret washing_machine_entity
  washing_machine_program_entity: !secret washing_machine_program_entity
  washing_machine_temperature_entity: !secret washing_machine_temperature_entity
  washing_machine_remaining_time_entity: !secret washing_machine_remaining_time_entity
# ============================================================================
# ESPHOME
# ============================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: -10
    then:
      - light.turn_on:
          id: backlight
          brightness: 65%


esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true


logger:
  level: WARN


api:
  on_client_connected:
    - wait_until:
        condition:
          api.connected:
            state_subscription_only: true
    - lvgl.widget.update:
        id: ha_status_dot
        bg_color: color_green
    - lvgl.label.update:
        id: ha_status_label
        text_color: color_green

  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - lvgl.widget.update:
              id: ha_status_dot
              bg_color: color_red
          - lvgl.label.update:
              id: ha_status_label
              text_color: color_red


  encryption:
    key: !secret cyd_dashboard__encryption_key
ota:
  - platform: esphome


wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  ap:
    ssid: "${device_name}-AP"
    password: !secret cyd_dashboard_ap_password


captive_portal:


# ============================================================================
# TIME
# ============================================================================

time:
  - platform: homeassistant
    id: ha_time

    on_time_sync:
      then:
        - script.execute: update_auto_brightness

    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - script.execute: update_auto_brightness

      - seconds: 0
        minutes: 0
        hours: 6
        then:
          - script.execute: update_auto_brightness

      - seconds: 0
        minutes: 0
        hours: 22
        then:
          - script.execute: update_auto_brightness


# ============================================================================
# SPI
# ============================================================================

spi:

  # Display
  - id: display_spi
    mosi_pin: GPIO13
    clk_pin: GPIO14

  # Touch
  - id: touch_spi
    mosi_pin: GPIO32
    miso_pin: GPIO39
    clk_pin: GPIO25


# ============================================================================
# BACKLIGHT
# ============================================================================

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_output


light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON


# ============================================================================
# DISPLAY
# ============================================================================

display:
  - platform: ili9xxx
    model: ili9341
    spi_id: display_spi

    cs_pin: GPIO15
    dc_pin: GPIO2

    dimensions:
      width: 320
      height: 240

    color_order: RGB
    invert_colors: false

    update_interval: never

    id: cyd_display


# ============================================================================
# TOUCH
# ============================================================================

touchscreen:
  - platform: xpt2046
    spi_id: touch_spi

    cs_pin: GPIO33
    interrupt_pin: GPIO36

    id: cyd_touch

    calibration:
      x_min: 361
      x_max: 3771
      y_min: 165
      y_max: 3775

    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true

    update_interval: 50ms


# ============================================================================
# FONTS
# ============================================================================

font:
  - file:
      type: gfonts
      family: Roboto
    id: font_body
    size: 14
    bpp: 4
    glyphs: " !\"%()'+-,./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"

  - file:
      type: gfonts
      family: Roboto
    id: font_temp_large
    size: 38
    bpp: 4
    glyphs: " 0123456789.-°"

  - file:
      type: gfonts
      family: Roboto
    id: font_small
    size: 11
    bpp: 4
    glyphs: " !\"%()'+-,./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_header
    size: 16
    bpp: 4
    glyphs: " !\"%()'+-,./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_greeting
    size: 20
    bpp: 4
    glyphs: " 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_volume
    size: 28
    bpp: 4
    glyphs: " 0123456789:%"

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_24
    size: 24
    bpp: 4
    glyphs:
      - "\U000F0335"
      - "\U000F0336"
      - "\U000F040A"
      - "\U000F0415"

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_40
    size: 40
    bpp: 4
    glyphs:
      - "\U000F0594"
      - "\U000F0591"
      - "\U000F0590"
      - "\U000F0595"
      - "\U000F0596"
      - "\U000F0597"
      - "\U000F0598"
      - "\U000F0599"
      - "\U000F067E"
      - "\U000F059D"

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icons_18
    size: 18
    bpp: 4
    glyphs:
      - "\U000F0335"
      - "\U000F0336"
      - "\U000F0E0E"
      - "\U000F05A9"  # WiFi


# ============================================================================
# COLOURS
# ============================================================================

color:

  - id: color_bg
    hex: "1A1A2E"

  - id: color_bg_card
    hex: "16213E"

  - id: color_bg_card_active
    hex: "2A2A4A"

  - id: color_teal
    hex: "64FFDA"

  - id: color_teal_dim
    hex: "1A3A34"

  - id: color_amber
    hex: "FFD93D"

  - id: color_amber_dim
    hex: "3A3420"

  - id: color_text_primary
    hex: "E6F1FF"

  - id: color_text_secondary
    hex: "8892B0"

  - id: color_text_tertiary
    hex: "4A5568"

  - id: color_border
    hex: "2A2A4A"

  - id: color_green
    hex: "4CAF50"

  - id: color_red
    hex: "FF5252"


# ============================================================================
# NUMERIC HOME ASSISTANT SENSORS
# ============================================================================

sensor:

  # --------------------------------------------------------------------------
  # WEATHER
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_temperature_entity}

    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_temp
            text:
              format: "%.0f"
              args: ["x"]


  - platform: homeassistant
    id: weather_apparent_temperature
    entity_id: ${weather_entity}
    attribute: apparent_temperature

    on_value:
      then:
        - lvgl.label.update:
            id: lbl_feels_like
            text:
              format: "%.0f°C"
              args: ["x"]


  - platform: homeassistant
    id: weather_humidity
    entity_id: ${weather_entity}
    attribute: humidity

    on_value:
      then:
        - lvgl.label.update:
            id: lbl_humidity_val
            text:
              format: "%.0f%%"
              args: ["x"]


  - platform: homeassistant
    id: weather_wind_speed
    entity_id: ${weather_wind_entity}

    on_value:
      then:
        - lvgl.label.update:
            id: lbl_wind_val
            text:
              format: "%.0f km/h"
              args: ["x"]


  - platform: homeassistant
    id: weather_pressure
    entity_id: ${weather_pressure_entity}

    on_value:
      then:
        - lvgl.label.update:
            id: lbl_pressure_val
            text:
              format: "%.0f hPa"
              args: ["x"]


  - platform: homeassistant
    id: weather_wind_bearing
    entity_id: ${weather_wind_bearing_entity}

    on_value:
      then:
        - lvgl.label.update:
            id: lbl_wind_direction_val
            text: !lambda |-
              float deg = fmodf(x + 360.0f, 360.0f);

              if (deg >= 337.5f || deg < 22.5f)
                return std::string("N");
              if (deg < 67.5f)
                return std::string("NO");
              if (deg < 112.5f)
                return std::string("O");
              if (deg < 157.5f)
                return std::string("ZO");
              if (deg < 202.5f)
                return std::string("Z");
              if (deg < 247.5f)
                return std::string("ZW");
              if (deg < 292.5f)
                return std::string("W");

              return std::string("NW");


  # --------------------------------------------------------------------------
  # AUDIO / VOLUME
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: media_player_volume
    entity_id: ${media_player_entity}
    attribute: volume_level

    on_value:
      then:
        - lvgl.slider.update:
            id: slider_media_volume
            value: !lambda return (x * 100.0f);

        - lvgl.label.update:
            id: lbl_audio_volume
            text:
              format: "%.0f%%"
              args: ["x * 100.0f"]


  # --------------------------------------------------------------------------
  # HUIS
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: living_room_temperature
    entity_id: ${living_room_climate_entity}
    attribute: current_temperature

    on_value:
      then:
        - lvgl.label.update:
            id: lbl_house_temperature
            text:
              format: "%.1f°C"
              args: ["x"]


  - platform: homeassistant
    id: washing_machine_temperature
    entity_id: ${washing_machine_temperature_entity}

    on_value:
      then:
        - script.execute: update_washing_machine_popup


  # Miele Remaining time: geschat aantal minuten resterend
  - platform: homeassistant
    id: washing_machine_remaining_time
    entity_id: ${washing_machine_remaining_time_entity}

    on_value:
      then:
        - script.execute: update_washing_machine_popup


  # --------------------------------------------------------------------------
  # LIGHT BRIGHTNESS
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: brightness_living
    entity_id: ${light_living_room}
    attribute: brightness
    on_value:
      then:
        - script.execute: update_light_cards
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.slider.update:
                  id: slider_light_living_dimmer
                  value: !lambda return x;
              - lvgl.label.update:
                  id: lbl_light_living_popup_pct
                  text:
                    format: "%.0f%%"
                    args: ["(x / 255.0f) * 100.0f"]


  - platform: homeassistant
    id: brightness_kitchen
    entity_id: ${light_kitchen}
    attribute: brightness
    on_value:
      then:
        - script.execute: update_light_cards
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.slider.update:
                  id: slider_light_kitchen_dimmer
                  value: !lambda return x;
              - lvgl.label.update:
                  id: lbl_light_kitchen_popup_pct
                  text:
                    format: "%.0f%%"
                    args: ["(x / 255.0f) * 100.0f"]


  - platform: homeassistant
    id: brightness_office
    entity_id: ${light_office}
    attribute: brightness
    on_value:
      then:
        - script.execute: update_light_cards
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.slider.update:
                  id: slider_light_office_dimmer
                  value: !lambda return x;
              - lvgl.label.update:
                  id: lbl_light_office_popup_pct
                  text:
                    format: "%.0f%%"
                    args: ["(x / 255.0f) * 100.0f"]


  - platform: homeassistant
    id: brightness_dressoir
    entity_id: ${light_dressoir}
    attribute: brightness
    on_value:
      then:
        - script.execute: update_light_cards
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.slider.update:
                  id: slider_light_dressoir_dimmer
                  value: !lambda return x;
              - lvgl.label.update:
                  id: lbl_light_dressoir_popup_pct
                  text:
                    format: "%.0f%%"
                    args: ["(x / 255.0f) * 100.0f"]


# ============================================================================
# TEXT HOME ASSISTANT SENSORS
# ============================================================================

text_sensor:

  # --------------------------------------------------------------------------
  # WEATHER CONDITION
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}

    on_value:
      then:

        - lvgl.label.update:
            id: lbl_weather_condition
            text: !lambda |-
              std::string cond = x;

              if (cond == "sunny")
                return std::string("Helder");

              if (cond == "clear-night")
                return std::string("Heldere nacht");

              if (cond == "partlycloudy")
                return std::string("Half bewolkt");

              if (cond == "cloudy")
                return std::string("Bewolkt");

              if (cond == "rainy")
                return std::string("Regen");

              if (cond == "pouring")
                return std::string("Veel regen");

              if (cond == "snowy")
                return std::string("Sneeuw");

              if (cond == "fog")
                return std::string("Mist");

              if (cond == "windy")
                return std::string("Winderig");

              return cond;


        - lvgl.label.update:
            id: lbl_weather_icon
            text: !lambda |-
              std::string cond = x;

              if (cond == "sunny")
                return std::string("\U000F0599");

              if (cond == "clear-night")
                return std::string("\U000F0594");

              if (cond == "partlycloudy")
                return std::string("\U000F0595");

              if (cond == "cloudy")
                return std::string("\U000F0590");

              if (cond == "rainy")
                return std::string("\U000F0597");

              if (cond == "pouring")
                return std::string("\U000F0596");

              if (cond == "snowy")
                return std::string("\U000F0598");

              if (cond == "fog")
                return std::string("\U000F0591");

              if (cond == "windy")
                return std::string("\U000F059D");

              return std::string("\U000F0595");



  # --------------------------------------------------------------------------
  # LIGHT STATES
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: state_light_living
    entity_id: ${light_living_room}
    on_value:
      then:
        - script.execute: update_light_cards


  - platform: homeassistant
    id: state_light_kitchen
    entity_id: ${light_kitchen}
    on_value:
      then:
        - script.execute: update_light_cards


  - platform: homeassistant
    id: state_light_office
    entity_id: ${light_office}
    on_value:
      then:
        - script.execute: update_light_cards


  - platform: homeassistant
    id: state_light_dressoir
    entity_id: ${light_dressoir}
    on_value:
      then:
        - script.execute: update_light_cards



  # --------------------------------------------------------------------------
  # MEDIA PLAYER
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: media_player_state
    entity_id: ${media_player_entity}
    on_value:
      then:
        - script.execute: update_music_cards
        - lvgl.label.update:
            id: lbl_audio_state
            text: !lambda |-
              if (x == "playing")
                return std::string("SPEELT");
              if (x == "paused")
                return std::string("GEPAUZEERD");
              if (x == "idle" || x == "standby")
                return std::string("GEREED");
              if (x == "off" || x == "unavailable")
                return std::string("NIET BESCHIKBAAR");
              return x;

        - if:
            condition:
              lambda: 'return x == "playing";'
            then:
              - script.stop: audio_return_home
            else:
              - if:
                  condition:
                    lvgl.page.is_showing: page_audio
                  then:
                    - script.execute: audio_return_home

  - platform: homeassistant
    id: media_player_title
    entity_id: ${media_player_entity}
    attribute: media_title
    on_value:
      then:
        - script.execute: update_music_cards
        - lvgl.label.update:
            id: lbl_audio_title
            text: !lambda |-
              if (x.empty())
                return std::string("Geen media");
              return x;


  # --------------------------------------------------------------------------
  # HUISSTATUS
  # --------------------------------------------------------------------------

  - platform: homeassistant
    id: front_door_lock_state
    entity_id: ${front_door_lock_entity}
    on_value:
      then:
        - script.execute: update_house_cards

  - platform: homeassistant
    id: washing_machine_state
    entity_id: ${washing_machine_entity}
    on_value:
      then:
        - script.execute: update_house_cards
        - script.execute: update_washing_machine_popup

        # Zodra de wasmachine aan gaat, automatisch de detail-popup openen.
        # Gaat de machine uit, dan sluit de popup automatisch weer.
        - if:
            condition:
              lambda: 'return x == "on";'
            then:
              - lvgl.widget.show: washing_popup_overlay
            else:
              - lvgl.widget.hide: washing_popup_overlay

  - platform: homeassistant
    id: washing_machine_program
    entity_id: ${washing_machine_program_entity}
    on_value:
      then:
        - script.execute: update_washing_machine_popup

# ============================================================================
# BINARY HOME ASSISTANT SENSORS
# ============================================================================

binary_sensor:

  - platform: homeassistant
    id: media_player_muted
    entity_id: ${media_player_entity}
    attribute: is_volume_muted


# ============================================================================
# SCRIPTS
# ============================================================================

script:

  # --------------------------------------------------------------------------
  # VERLICHTING KLIKLOGICA
  # Een enkele tik wordt 350 ms uitgesteld.
  # Komt er een tweede tik, dan stopt deze actie en opent de dimmer-popup.
  # --------------------------------------------------------------------------

  - id: light_living_single_click
    mode: restart
    then:
      - delay: 350ms
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${light_living_room}

  - id: light_kitchen_single_click
    mode: restart
    then:
      - delay: 350ms
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${light_kitchen}

  - id: light_office_single_click
    mode: restart
    then:
      - delay: 350ms
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${light_office}

  - id: light_dressoir_single_click
    mode: restart
    then:
      - delay: 350ms
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${light_dressoir}


  # Audio: als afspelen stopt/pauzeert, na 1 minuut terug naar Home
  - id: audio_return_home
    mode: restart
    then:
      - delay: 1min
      - if:
          condition:
            lvgl.page.is_showing: page_audio
          then:
            - if:
                condition:
                  lambda: 'return id(media_player_state).state != "playing";'
                then:
                  - lvgl.page.show:
                      id: page_weather
                      animation: MOVE_RIGHT
                      time: 300ms


  # --------------------------------------------------------------------------
  # NAVIGATION DOTS
  # --------------------------------------------------------------------------

  - id: update_dots
    parameters:
      page: int

    then:

      - lvgl.widget.update:
          id: dot_0
          bg_color: !lambda |-
            return page == 0
              ? lv_color_hex(0x64FFDA)
              : lv_color_hex(0x2A2A4A);

      - lvgl.widget.update:
          id: dot_1
          bg_color: !lambda |-
            return page == 1
              ? lv_color_hex(0x64FFDA)
              : lv_color_hex(0x2A2A4A);

      - lvgl.widget.update:
          id: dot_2
          bg_color: !lambda |-
            return page == 2
              ? lv_color_hex(0x64FFDA)
              : lv_color_hex(0x2A2A4A);

      - lvgl.widget.update:
          id: dot_3
          bg_color: !lambda |-
            return page == 3
              ? lv_color_hex(0x64FFDA)
              : lv_color_hex(0x2A2A4A);

      - lvgl.widget.update:
          id: dot_4
          bg_color: !lambda |-
            return page == 4
              ? lv_color_hex(0x64FFDA)
              : lv_color_hex(0x2A2A4A);


  # --------------------------------------------------------------------------
