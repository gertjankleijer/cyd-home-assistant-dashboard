  # 06:00-21:59 = 85%, 22:00-23:59 = 30%, 00:00-05:59 = 15%
  # --------------------------------------------------------------------------

  - id: update_auto_brightness
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              return now.is_valid() && now.hour >= 6 && now.hour < 22;
          then:
            - number.set:
                id: display_brightness
                value: 85
          else:
            - if:
                condition:
                  lambda: |-
                    auto now = id(ha_time).now();
                    return now.is_valid() && now.hour >= 22;
                then:
                  - number.set:
                      id: display_brightness
                      value: 30
                else:
                  - number.set:
                      id: display_brightness
