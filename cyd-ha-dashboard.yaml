            height: 58
            x: 14
            y: 162
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
            widgets:

              - button:
                  id: btn_music_bingo_fm
                  width: 140
                  height: 58
                  styles: style_card
                  on_click:
                    then:
                      - homeassistant.action:
                          action: button.press
                          data:
                            entity_id: ${music_bingo_fm}
                      - delay: 350ms
                      - lvgl.page.show:
                          id: page_audio
