                        text_font: font_small
                        text_color: color_teal
                        align: BOTTOM_MID
                        y: -4


    # ========================================================================

    # ========================================================================
    # PAGE 5 — AUDIO
    # ========================================================================

    - id: page_audio
      scrollable: false
      scrollbar_mode: "OFF"

      on_load:
        - script.execute:
            id: update_dots
            page: 4
        - if:
            condition:
              lambda: 'return id(media_player_state).state == "playing";'
            then:
              - script.stop: audio_return_home
            else:
              - script.execute: audio_return_home
        - lvgl.slider.update:
            id: slider_media_volume
            value: !lambda |-
              if (isnan(id(media_player_volume).state))
                return 0;
              return id(media_player_volume).state * 100.0f;
        - lvgl.label.update:
            id: lbl_audio_volume
            text: !lambda |-
              if (isnan(id(media_player_volume).state))
                return std::string("--%");
              char buf[12];
              snprintf(buf, sizeof(buf), "%.0f%%", id(media_player_volume).state * 100.0f);
              return std::string(buf);
        - lvgl.label.update:
            id: lbl_audio_title
            text: !lambda |-
              if (id(media_player_title).state.empty())
                return std::string("Geen media");
              return id(media_player_title).state;
        - lvgl.label.update:
            id: lbl_audio_state
            text: !lambda |-
              const auto &s = id(media_player_state).state;
              if (s == "playing")
                return std::string("SPEELT");
              if (s == "paused")
                return std::string("GEPAUZEERD");
              if (s == "idle" || s == "standby")
                return std::string("GEREED");
              if (s == "off" || s == "unavailable")
                return std::string("NIET BESCHIKBAAR");
              return s;

      on_swipe_right:
        then:
          - lvgl.page.previous:
              animation: MOVE_RIGHT
              time: 300ms

      bg_color: color_bg
      bg_opa: COVER
      pad_all: 0

      widgets:

        # Header
        - obj:
            width: 292
            height: 28
            x: 14
            y: 2
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
            widgets:
              - label:
                  text: "Audio"
                  text_font: font_header
                  text_color: color_text_primary
              - label:
                  text: "ECHO DOT"
                  text_font: font_small
                  text_color: color_teal

        # Now playing
        - obj:
            width: 292
            height: 42
            x: 14
            y: 34
            styles: style_card
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: lbl_audio_state
                  text: "Laden..."
                  text_font: font_small
                  text_color: color_teal
                  x: 2
                  y: 0
              - label:
                  id: lbl_audio_title
                  text: "Geen media"
                  text_font: font_body
                  text_color: color_text_primary
                  width: 270
                  long_mode: DOT
                  x: 2
                  y: 17

        # Volume percentage
        - label:
            id: lbl_audio_volume
            text: "--%"
            text_font: font_volume
            text_color: color_text_primary
            align: TOP_MID
            y: 79

        # Volume slider
        - slider:
            id: slider_media_volume
            x: 28
            y: 111
            width: 264
            height: 22
            min_value: 0
            max_value: 100
            value: 30
            adv_hittest: true
            ext_click_area: 8
            bg_color: color_bg_card_active
            bg_opa: COVER
            radius: 10
            border_width: 0
            indicator:
              bg_color: color_teal
              bg_opa: COVER
              radius: 10
            knob:
              bg_color: color_teal
              bg_opa: COVER
              radius: 10
            on_change:
              then:
                - lvgl.label.update:
                    id: lbl_audio_volume
                    text:
                      format: "%.0f%%"
                      args: ["x"]
            on_release:
              then:
                - homeassistant.action:
                    action: media_player.volume_set
                    data:
                      entity_id: ${media_player_entity}
                      volume_level: !lambda return (x / 100.0f);

        # Volume controls
        - obj:
            width: 292
            height: 36
            x: 14
            y: 143
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
            widgets:
              - button:
                  width: 82
                  height: 36
                  styles: style_card
                  pad_all: 0
                  on_click:
                    then:
                      - homeassistant.action:
                          action: media_player.volume_down
                          data:
                            entity_id: ${media_player_entity}
                  widgets:
                    - label:
                        text: "-"
                        text_font: font_header
                        text_color: color_teal
                        align: CENTER

              - button:
                  width: 116
                  height: 36
                  styles: style_card
                  pad_all: 0
                  on_click:
                    then:
                      - if:
                          condition:
                            binary_sensor.is_on: media_player_muted
                          then:
                            - homeassistant.action:
                                action: media_player.volume_mute
                                data:
                                  entity_id: ${media_player_entity}
                                  is_volume_muted: "false"
                          else:
                            - homeassistant.action:
                                action: media_player.volume_mute
                                data:
                                  entity_id: ${media_player_entity}
                                  is_volume_muted: "true"
                  widgets:
                    - label:
                        text: "MUTE"
                        text_font: font_small
                        text_color: color_text_primary
                        align: CENTER

              - button:
                  width: 82
                  height: 36
                  styles: style_card
                  pad_all: 0
                  on_click:
                    then:
                      - homeassistant.action:
                          action: media_player.volume_up
                          data:
                            entity_id: ${media_player_entity}
                  widgets:
                    - label:
                        text: "+"
                        text_font: font_header
                        text_color: color_teal
                        align: CENTER

        # Playback controls
        - obj:
            width: 292
            height: 36
            x: 14
            y: 185
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
            widgets:
              - button:
                  width: 140
                  height: 36
                  styles: style_card_teal
                  pad_all: 0
                  on_click:
                    then:
                      - homeassistant.action:
                          action: media_player.media_play_pause
                          data:
                            entity_id: ${media_player_entity}
                  widgets:
                    - label:
                        text: "PLAY / PAUZE"
                        text_font: font_small
                        text_color: color_teal
                        align: CENTER

              - button:
                  width: 140
                  height: 36
                  styles: style_card
                  pad_all: 0
                  on_click:
                    then:
                      - homeassistant.action:
                          action: media_player.media_stop
                          data:
                            entity_id: ${media_player_entity}
                  widgets:
                    - label:
                        text: "STOP"
                        text_font: font_small
                        text_color: color_red
                        align: CENTER


# ============================================================================
# CLOCK / BEGROETING / STATUS
# ============================================================================

interval:

  - interval: 30s

    then:

      # Begroeting
      - lvgl.label.update:
          id: lbl_greeting
          text: !lambda |-
            auto now = id(ha_time).now();

            if (!now.is_valid())
              return std::string("Welkom");

            if (now.hour >= 5 && now.hour < 12)
              return std::string("Goedemorgen");

            if (now.hour >= 12 && now.hour < 18)
              return std::string("Goedemiddag");

            if (now.hour >= 18)
              return std::string("Goedenavond");

            return std::string("Goedenacht");

      # Volledige datum onder de begroeting
      - lvgl.label.update:
          id: lbl_greeting_date
          text: !lambda |-
            auto now = id(ha_time).now();

            if (!now.is_valid())
              return std::string("--");

            const char* days_full[] = {
              "Zondag",
              "Maandag",
              "Dinsdag",
              "Woensdag",
              "Donderdag",
              "Vrijdag",
              "Zaterdag"
            };

            const char* months_full[] = {
              "januari",
              "februari",
              "maart",
              "april",
              "mei",
              "juni",
              "juli",
              "augustus",
              "september",
              "oktober",
              "november",
              "december"
            };

            char buf[48];

            snprintf(
              buf,
              sizeof(buf),
              "%s %d %s",
              days_full[now.day_of_week - 1],
              now.day_of_month,
              months_full[now.month - 1]
            );

            return std::string(buf);

      # Grote tijd onder de datum
      - lvgl.label.update:
          id: lbl_home_time
          text: !lambda |-
            auto now = id(ha_time).now();

            if (!now.is_valid())
              return std::string("--:--");

            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);

      # Kleine korte datum linksboven; geen dubbele tijd meer
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto now = id(ha_time).now();

            if (!now.is_valid())
              return std::string("-- -- ---");

            const char* days[] = {
              "ZO",
              "MA",
              "DI",
              "WO",
              "DO",
              "VR",
              "ZA"
            };

            const char* months[] = {
              "JAN",
              "FEB",
              "MRT",
              "APR",
              "MEI",
              "JUN",
              "JUL",
              "AUG",
              "SEP",
              "OKT",
              "NOV",
              "DEC"
            };

            char buf[16];

            snprintf(
              buf,
              sizeof(buf),
              "%s %d %s",
              days[now.day_of_week - 1],
              now.day_of_month,
              months[now.month - 1]
            );

            return std::string(buf);

  - interval: 5s
    then:
      - script.execute: update_ha_connection

  - interval: 30s
    then:
      - script.execute: update_washing_machine_popup

# ============================================================================
# DISPLAY BRIGHTNESS
# ============================================================================

number:

  - platform: template
    name: "Display Brightness"
    id: display_brightness

    min_value: 10
    max_value: 100
    step: 5

    initial_value: 65
    optimistic: true

    set_action:

      - light.turn_on:
          id: backlight
          brightness: !lambda |-
            return x / 100.0;