      # Programma — volledige vertaling van de HA enum-opties naar Nederlands
      - lvgl.label.update:
          id: lbl_washing_popup_program
          text: !lambda |-
            std::string value = id(washing_machine_program).state;

            if (value.empty() || value == "unknown" || value == "unavailable")
              return std::string("-");

            std::string p = value;
            for (auto &c : p)
              c = tolower(c);

            if (p == "automatic_plus")
              return std::string("Automatic Plus");

            if (p == "bed_linen")
              return std::string("Beddengoed");

            if (p == "clean_machine")
              return std::string("Machine reinigen");

