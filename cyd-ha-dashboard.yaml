            if (p == "dark_garments")
              return std::string("Donkere was");

            if (p == "dark_jeans")
              return std::string("Donkere jeans");

            if (p == "delicates")
              return std::string("Fijne was");

            if (p == "denim")
              return std::string("Jeans");

            if (p == "down_duvets")
              return std::string("Donzen dekbedden");

            if (p == "down_filled_items")
              return std::string("Dons");

            if (p == "drain_spin")
              return std::string("Pompen / Centrif.");

            if (p == "easy_care")
              return std::string("Kreukherstellend");

            if (p == "eco_40_60")
              return std::string("ECO 40-60");

            if (p == "express_20")
              return std::string("Express 20");

            if (p == "first_wash")
              return std::string("Nieuwe kleding");

            if (p == "freshen_up")
              return std::string("Opfrissen");

            if (p == "game_pieces")
              return std::string("Speelgoed");

            if (p == "minimum_iron")
              return std::string("Kreukherstellend");

            if (p == "no_program")
              return std::string("Geen programma");

            if (p == "normal")
              return std::string("Normaal");

            if (p == "outdoor_garments")
              return std::string("Outdoorkleding");

            if (p == "outerwear")
              return std::string("Outdoor");

            if (p == "pillows")
              return std::string("Hoofdkussens");

            if (p == "powerfresh")
              return std::string("PowerFresh");

            if (p == "pre_ironing")
              return std::string("Voorstrijken");

            if (p == "proofing")
              return std::string("Impregneren");

            if (p == "quick_intense")
              return std::string("Quick Intense");

            if (p == "quick_power_wash")
              return std::string("QuickPowerWash");

            if (p == "rinse")
              return std::string("Spoelen");

            if (p == "rinse_out_lint")
              return std::string("Pluizen spoelen");

            if (p == "separate_rinse_starch")
              return std::string("Spoelen / Stijven");

            if (p == "shirts")
              return std::string("Overhemden");

            if (p == "silks")
              return std::string("Zijde");

            if (p == "smartmatic")
              return std::string("SmartMatic");

            if (p == "sportswear")
              return std::string("Sportkleding");

            if (p == "starch")
              return std::string("Stijven");

            if (p == "steam_care")
              return std::string("Stoomverzorging");

            if (p == "stuffed_toys")
              return std::string("Knuffels");

            if (p == "table_linen")
              return std::string("Tafellinnen");

            if (p == "trainers")
              return std::string("Sportschoenen");

            if (p == "trainers_refresh")
              return std::string("Schoenen opfrissen");

            if (p == "warm_air")
              return std::string("Warme lucht");

            if (p == "woollens")
              return std::string("Wol");

            // Onbekende toekomstige waarde:
            // underscores vervangen door spaties zodat het toch leesbaar blijft.
            for (auto &c : value) {
              if (c == '_')
                c = ' ';
            }

            return value;

      # Temperatuur
      - lvgl.label.update:
          id: lbl_washing_popup_temperature
          text: !lambda |-
            float value = id(washing_machine_temperature).state;

            if (isnan(value))
              return std::string("-");

            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", value);
            return std::string(buf);

      # Nog te gaan — officiële Miele Remaining time sensor (minuten)
      - lvgl.label.update:
          id: lbl_washing_popup_end_time
          text: !lambda |-
            if (id(washing_machine_state).state != "on")
              return std::string("-");

            float value = id(washing_machine_remaining_time).state;

            if (isnan(value) || value < 0)
              return std::string("-");

            int total_minutes = (int) lroundf(value);
            int hours = total_minutes / 60;
            int minutes = total_minutes % 60;

            char buf[24];

            if (hours <= 0) {
              snprintf(buf, sizeof(buf), "%d min", minutes);
            } else if (minutes == 0) {
              snprintf(buf, sizeof(buf), "%du", hours);
            } else {
              snprintf(buf, sizeof(buf), "%du %02dm", hours, minutes);
            }

            return std::string(buf);


# ============================================================================
# LVGL
# ============================================================================

lvgl:

  rotation: 180

  theme:
    obj:
      scrollbar_mode: "OFF"
      pad_all: 0


  displays:
    - cyd_display


  touchscreens:
    - cyd_touch


  color_depth: 16
  buffer_size: 25%

  # Na 1 minuut zonder aanraking terug naar Home.
  # Op de Audio-pagina blijft hij staan zolang Echo Dot 'playing' is.
  on_idle:
    timeout: 1min
    then:
      - if:
          condition:
            not:
              lvgl.page.is_showing: page_weather
          then:
            - if:
                condition:
                  lvgl.page.is_showing: page_audio
                then:
                  - if:
                      condition:
                        lambda: 'return id(media_player_state).state != "playing";'
                      then:
                        - lvgl.page.show:
                            id: page_weather
                            animation: MOVE_RIGHT
                            time: 300ms
                else:
                  - lvgl.widget.hide: lock_popup_overlay
                  - lvgl.widget.hide: washing_popup_overlay
                  - lvgl.widget.hide: guest_wifi_overlay
                  - lvgl.widget.hide: light_living_popup_overlay
                  - lvgl.widget.hide: light_kitchen_popup_overlay
                  - lvgl.widget.hide: light_office_popup_overlay
                  - lvgl.widget.hide: light_dressoir_popup_overlay
                  - lvgl.page.show:
                      id: page_weather
                      animation: MOVE_RIGHT
                      time: 300ms


  # --------------------------------------------------------------------------
  # STYLES
  # --------------------------------------------------------------------------

  style_definitions:

    - id: style_card
      bg_color: color_bg_card
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: color_border
      pad_all: 8
      scrollbar_mode: "OFF"


    - id: style_card_teal
      bg_color: color_teal_dim
      bg_opa: COVER
      radius: 8
      border_width: 1
      border_color: color_teal
      pad_all: 6
      scrollbar_mode: "OFF"
      

  # --------------------------------------------------------------------------
  # TOP LAYER — PAGE DOTS
  # --------------------------------------------------------------------------

  top_layer:

    widgets:

      # ----------------------------------------------------------------------
      # VASTE PAGINANAVIGATIE ONDERIN
      # Links = vorige pagina, rechts = volgende pagina.
      # Dankzij page_wrap: true loopt Audio -> Weer en Weer -> Audio.
      # ----------------------------------------------------------------------

      - button:
          id: btn_page_previous
          x: 6
          y: 214
          width: 30
          height: 22
          bg_color: color_bg_card
          bg_opa: COVER
          border_width: 1
          border_color: color_border
          radius: 7
          pad_all: 0
          on_click:
            then:
              - lvgl.page.previous:
                  animation: MOVE_RIGHT
                  time: 300ms
          widgets:
            - label:
                text: "<"
                text_font: font_header
                text_color: color_text_secondary
                align: CENTER

      - button:
          id: btn_page_next
          x: 284
          y: 214
          width: 30
          height: 22
          bg_color: color_bg_card
          bg_opa: COVER
          border_width: 1
          border_color: color_border
          radius: 7
          pad_all: 0
          on_click:
            then:
              - lvgl.page.next:
                  animation: MOVE_LEFT
                  time: 300ms
          widgets:
            - label:
                text: ">"
                text_font: font_header
                text_color: color_text_secondary
                align: CENTER

      - obj:
          id: dot_0
          x: 123
          y: 231
          width: 10
          height: 6
          radius: 3
          bg_color: color_teal
          bg_opa: COVER
          border_width: 0
          on_click:
            then:
              - lvgl.page.show:
                  id: page_weather
                  animation: MOVE_RIGHT
                  time: 300ms

      - obj:
          id: dot_1
          x: 139
          y: 231
