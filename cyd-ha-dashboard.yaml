  page_wrap: true


  # ==========================================================================
  # PAGES
  # ==========================================================================

  pages:

    # ========================================================================
    # PAGE 1 — WEATHER
    # ========================================================================

    - id: page_weather

      on_load:
        - script.execute:
            id: update_dots
            page: 0


      on_swipe_left:
        then:
          - lvgl.page.next:
              animation: MOVE_LEFT
              time: 300ms


      on_swipe_right:
        then:
          - lvgl.page.previous:
              animation: MOVE_RIGHT
              time: 300ms


      bg_color: color_bg
      bg_opa: COVER
      pad_all: 0


      widgets:

        # Header
        - obj:
            width: 320
            height: 22
            x: 0
            y: 0

            pad_left: 14
            pad_right: 14

