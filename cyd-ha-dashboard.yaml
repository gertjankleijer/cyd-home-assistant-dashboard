                        text_font: font_small
                        text_color: color_teal
                        align: BOTTOM_MID
                        y: -4

              - button:
                  id: btn_music_sterren_nl
                  width: 140
                  height: 58
                  styles: style_card
                  on_click:
                    then:
                      - homeassistant.action:
                          action: button.press
                          data:
                            entity_id: ${music_sterren_nl}
                      - delay: 350ms
                      - lvgl.page.show:
                          id: page_audio
                          animation: MOVE_LEFT
                          time: 300ms
